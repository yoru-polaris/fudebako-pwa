<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Narra</title>
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Narra">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="btnDrawer" class="iconbtn" aria-label="チャット一覧">☰</button>
    <div id="titleBox">
      <button id="chatTitle" class="plain">新しいチャット</button>
      <div id="chips">
        <button id="promptChip" class="chip">プロンプト：なし</button>
        <button id="charChip" class="chip">👤 0</button>
        <button id="modelChip" class="chip">モデル未選択</button>
      </div>
    </div>
    <button id="btnImages" class="iconbtn" aria-label="画像の表示切り替え">🖼</button>
    <button id="btnSettings" class="iconbtn" aria-label="設定">⚙</button>
  </header>

  <main id="messages"></main>
  <div id="scrollbar" hidden><i></i></div>

  <footer id="composer">
    <button id="btnTop" class="jump" aria-label="一番上へ" hidden>▲</button>
    <button id="btnBottom" class="jump" aria-label="一番下へ" hidden>▼</button>
    <textarea id="input" rows="1" placeholder="メッセージを入力"></textarea>
    <button id="btnSend" class="primary">送信</button>
  </footer>
</div>

<div id="backdrop" hidden></div>

<aside id="drawer" hidden>
  <div class="panelhead">
    <strong>チャット一覧</strong>
    <button class="iconbtn" data-close aria-label="閉じる">✕</button>
  </div>
  <button id="btnNewChat" class="primary wide">＋ 新しいチャット</button>
  <div class="btnrow" id="drawerTools"></div>
  <input id="chatSearch" type="text" placeholder="🔍 タイトル・本文を検索" style="margin-top:8px">
  <div id="chatList"></div>
</aside>

<section id="sheet" hidden>
  <div class="panelhead">
    <strong id="sheetTitle"></strong>
    <button class="iconbtn" data-close aria-label="閉じる">✕</button>
  </div>
  <div id="sheetBody"></div>
</section>

<section id="settings" hidden>
  <div class="panelhead">
    <strong>設定</strong>
    <button class="iconbtn" data-close aria-label="閉じる">✕</button>
  </div>
  <nav id="tabs">
    <button data-tab="conn" class="on">接続先</button>
    <button data-tab="prompts">プロンプト</button>
    <button data-tab="chars">キャラ</button>
    <button data-tab="ui">表示</button>
    <button data-tab="data">データ</button>
  </nav>
  <div id="settingsBody"></div>
</section>

<div id="toast" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
