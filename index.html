<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Narra</title>
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Narra">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="toprow">
      <button id="btnDrawer" class="iconbtn" aria-label="チャット一覧"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button id="chatTitle" class="plain">新しいチャット</button>
      <button id="btnImages" class="iconbtn" aria-label="画像の表示切り替え"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5-9 9"/></svg></button>
      <button id="btnSetup" class="iconbtn" aria-label="この話の設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
      <button id="btnSettings" class="iconbtn" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
    <div id="chips">
      <button id="heroChip" class="chip" aria-label="この話の設定（主人公）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>主人公なし</span></button>
      <button id="modelChip" class="chip" aria-label="モデルを選ぶ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 9h6v6H9zM9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg><b id="connTag" hidden></b><span>モデル未選択</span></button>
    </div>
  </header>

  <main id="messages"></main>
  <div id="scrollbar" hidden><i></i></div>

  <div id="pending" hidden></div>
  <footer id="composer">
    <button id="btnTop" class="jump" aria-label="一番上へ" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
    <button id="btnBottom" class="jump" aria-label="一番下へ" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <button id="btnAttach" class="iconbtn" aria-label="画像やテキストを添付">＋</button>
    <button id="btnInsert" class="iconbtn" aria-label="差し込みプロンプト"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg></button>
    <textarea id="input" rows="1" placeholder="メッセージを入力"></textarea>
    <button id="btnSend" class="primary">送信</button>
  </footer>
</div>

<div id="backdrop" hidden></div>

<aside id="drawer" hidden>
  <div class="panelhead">
    <strong>チャット一覧</strong>
    <button class="iconbtn" data-close aria-label="閉じる">✕</button>
  </div>
  <button id="btnNewChat" class="primary wide">＋ 新しいチャット</button>
  <div class="btnrow" id="drawerTools"></div>
  <input id="chatSearch" type="text" placeholder="タイトル・本文を検索" style="margin-top:8px">
  <div id="chatList"></div>
</aside>

<section id="sheet" hidden>
  <div class="panelhead">
    <strong id="sheetTitle"></strong>
    <button class="iconbtn" data-close aria-label="閉じる">✕</button>
  </div>
  <div id="sheetBody"></div>
</section>

<section id="phone" hidden></section>

<aside id="setup" hidden>
  <div class="panelhead">
    <strong>この話の設定</strong>
    <button class="iconbtn" data-close aria-label="閉じる">✕</button>
  </div>
  <div id="setupBody"></div>
</aside>

<section id="settings" hidden>
  <div class="panelhead">
    <strong>設定</strong>
    <button class="iconbtn" data-close aria-label="閉じる">✕</button>
  </div>
  <nav id="tabs">
    <button data-tab="conn" class="on">接続先</button>
    <button data-tab="prompts">プロンプト</button>
    <button data-tab="chars">キャラ</button>
    <button data-tab="ui">表示</button>
    <button data-tab="data">データ</button>
  </nav>
  <div id="settingsBody"></div>
</section>

<div id="toast" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
